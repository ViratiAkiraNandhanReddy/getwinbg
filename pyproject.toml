[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getwinbg"
dynamic = ["version"]
description = "A Python package and CLI for discovering, retrieving, inspecting, and managing Windows desktop backgrounds, built-in wallpapers, cached Bing images, and lock screen Spotlight collections."
readme = "README.md"
requires-python = ">=3.13"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Virati Akiranandhan Reddy" }
]

keywords = [
    "windows",
    "wallpaper",
    "background",
    "desktop",
    "spotlight",
    "bing",
    "Virati Akiranandhan Reddy",
    "viratiakiranandhanreddy",
]

classifiers = [
    "Environment :: Console",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",

    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Libraries",

    "Typing :: Typed",
]

import-names = [
    "getwinbg",
]

dependencies = [
    "rich>=13.9.4",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://getwinbg.readthedocs.io"
Documentation = "https://getwinbg.readthedocs.io"
Repository = "https://github.com/viratiakiranandhanreddy/getwinbg"
Issues = "https://github.com/viratiakiranandhanreddy/getwinbg/issues"
Changelog = "https://getwinbg.readthedocs.io/en/latest/changelog/"

[project.scripts]
getwinbg = "getwinbg.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.hatch.version]
path = "src/getwinbg/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/getwinbg"]

[tool.ruff]
src = ["src", "tests"]

target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # Pyflakes
    "A",      # flake8-builtins
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["getwinbg"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-platform = "win32"

[tool.ty.rules]
all = "error"
