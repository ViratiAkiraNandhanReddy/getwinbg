name: Ruff

on:
  # Run Ruff on changes that can affect Python code or its configuration.
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/ruff.yml'

  # Validate pull requests before they are merged into main.
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/ruff.yml'

  # Allow Ruff to be run manually when needed.
  workflow_dispatch:

# Cancel outdated runs when new commits are pushed to the same ref.
# Only the latest commit needs to pass Ruff.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ruff only needs read access to the repository.
permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Fetch the repository so Ruff can inspect the source tree.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Run all enabled Ruff lint rules from pyproject.toml.
      # GitHub output adds inline annotations to the workflow results.
      - name: Check lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format=github

      # Verify that the repository is formatted with Ruff.
      # --check keeps CI read-only, while --diff shows the required changes.
      - name: Check formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check --diff --output-format=github
