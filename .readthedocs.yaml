# Read the Docs configuration for Sphinx documentation projects.
# Reference: https://docs.readthedocs.com/platform/stable/config-file/v2.html

# Configuration schema version required by Read the Docs.
version: 2

# Defines the operating system and toolchain used for documentation builds.
build:
  os: ubuntu-26.04
  tools:
    python: "3.14"

# Configures the Sphinx documentation build.
sphinx:

  # Path to the Sphinx configuration file, relative to the repository root.
  configuration: docs/conf.py

  # Generates directory-based URLs without .html extensions.
  builder: dirhtml

  # Treats Sphinx warnings as errors to prevent broken references
  # and incomplete documentation builds.
  fail_on_warning: true

# Generates all additional documentation formats supported by Read the Docs:
# HTML ZIP, PDF, and ePub. Standard HTML is generated by default.
formats: all

# Installs the Python dependencies required to build the documentation.
# Keeping documentation dependencies separate ensures a reproducible
# environment without requiring the package's runtime dependencies.
# Reference: https://docs.readthedocs.com/platform/stable/guides/reproducible-builds.html
python:
  install:
    - requirements: docs/requirements.txt
